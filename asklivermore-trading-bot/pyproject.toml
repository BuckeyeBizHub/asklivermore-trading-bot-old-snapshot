[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asklivermore-trading-bot"
version = "0.1.0"
description = "Autonomous LangGraph multi-agent trading bot built on the AskLivermore methodology"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "BuckeyeBizHub" }]

dependencies = [
    "langgraph>=0.2.40",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.2.0",
    "anthropic>=0.40.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "websockets>=12.0",
    "structlog>=24.1",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "alpaca-py>=0.33",
    "ib_insync>=0.9.86",
    "python-telegram-bot>=21.0",
    "twilio>=9.0",
    "rich>=13.7",
    "tenacity>=9.0",
    "watchdog>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "pre-commit>=3.7",
]

[project.scripts]
asklivermore-bot = "core.main:cli"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "TID"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
